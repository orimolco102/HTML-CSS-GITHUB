<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Rock Paper Scissors</h1>
    </header>

    <div class="buttoncontainer">
      <button id="Rock" onclick="res(this.id); showElement()">
        <img src="images/rock-emoji.png" alt="" />
      </button>
      <button id="Paper" onclick="res(this.id); showElement()">
        <img src="images/paper-emoji.png" alt="" />
      </button>
      <button id="Scissors" onclick="res(this.id); showElement()">
        <img src="images/scissors-emoji.png" alt="" />
      </button>
    </div>

    <div class="statcont">
      <p id ='txt' class="picks sb"></p>
      <p id ='txt' class="result sb"></p>
      <p id ='txt' class="score sb"></p>
      <div class="reset-game">
        <button
          class="reset"
          id="clear"
          onclick="
            res(this.id);
            localStorage.removeItem('score');
            UpdateScore();
            hideElement();
            location.reload();
            // StopAuto();
          "
        >
          Reset Game
        </button>
        <button 
        class="start-game"
        onclick="StartAuto(); showElement()">
          Auto Play
        </button>
      </div>
    </div>
  </body>
</html>
