<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
</head>
<style>
    .flex-sec{
        text-align: center;
        padding: 40px;
    }

    .flex-container{
        display: flex;
        justify-content: space-evenly;
        margin-top: 50px;
    }

    .box{
        display: flex;
        border: 5px solid black;
        height: 80px;
        width: 80px;
        background-color: #505050;
        color: white;
        justify-content: center;
        align-items: center;
    }
</style>
<body>
    <section  class="flex_sec">
        <h2>Flex practice</h2>
        <p>Using flex</p>
        <div class="flex-container">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </section>

</body>
</html>
